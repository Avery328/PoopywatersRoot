<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0f12"><link rel="manifest" href="manifest.json"><title>Poopywater</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center}.app{max-width:600px;margin:auto;padding:25px 18px 50px}.card{background:#181b21;border:1px solid #2b3038;border-radius:24px;padding:24px;margin:14px 0}.logo{font-size:80px}.title{font-size:46px;font-weight:900}.score{font-size:58px;font-weight:900;margin:10px}.btn{width:100%;padding:18px;border:0;border-radius:18px;font-size:19px;font-weight:900;margin-top:10px}.primary{background:white;color:#111}.stat{display:inline-block;width:45%;font-size:25px;font-weight:900}.muted{color:#9da3aa}.bar{height:12px;background:#30343b;border-radius:9px;overflow:hidden}.fill{height:100%;background:#73d7ff;width:0%}</style></head>
<body><div class="app"><div class="logo">💩💧</div><div class="title">Poopywater</div><div class="muted">The world's most unnecessary water empire.</div>
<div class="card"><div class="muted">LEVEL</div><div class="score" id="level">1</div><div><span id="xp">0</span> / <span id="need">100</span> XP</div><div class="bar"><div class="fill" id="bar"></div></div><button class="btn primary" onclick="make()">💩 MAKE POOPYWATER</button></div>
<div class="card"><div class="stat">💧 <span id="water">0</span><small class="muted"> water</small></div><div class="stat">🪙 <span id="coins">0</span><small class="muted"> coins</small></div></div>
<div class="card"><b>🔥 Streak: <span id="streak">0</span></b><p class="muted">Tap to grow your empire. Random lucky flushes can happen!</p></div>
<button class="btn" onclick="upgrade()" style="background:#252a32;color:white">🛠 Upgrade Toilet — <span id="cost">25</span> coins</button>
<button class="btn" onclick="resetGame()" style="background:#252a32;color:#aaa">Reset Progress</button>
</div>
<script>
let s=JSON.parse(localStorage.poopywater||'{"water":0,"coins":0,"xp":0,"level":1,"streak":0,"power":1,"cost":25}');
function save(){localStorage.poopywater=JSON.stringify(s);render()}function make(){s.water+=s.power;s.coins+=1;s.xp+=10;s.streak++;if(Math.random()<.1){s.coins+=10;alert("🍀 LUCKY FLUSH! +10 coins")}if(s.xp>=s.level*100){s.xp-=s.level*100;s.level++;alert("🎉 LEVEL UP!")}save()}function upgrade(){if(s.coins>=s.cost){s.coins-=s.cost;s.power++;s.cost=Math.ceil(s.cost*1.8);save()}else alert("You need "+s.cost+" coins!")}function resetGame(){if(confirm("Reset Poopywater?")){localStorage.removeItem("poopywater");location.reload()}}function render(){document.getElementById("level").textContent=s.level;document.getElementById("xp").textContent=s.xp;document.getElementById("need").textContent=s.level*100;document.getElementById("bar").style.width=Math.min(100,s.xp/(s.level*100)*100)+"%";document.getElementById("water").textContent=s.water;document.getElementById("coins").textContent=s.coins;document.getElementById("streak").textContent=s.streak;document.getElementById("cost").textContent=s.cost}render();
</script></body></html>
